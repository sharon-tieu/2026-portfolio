<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Monitor Case Study</title>
<meta name="robots" content="noindex">
<!-- The case study itself is encrypted (assets/market-monitor.locked.json). This page only asks for the password.
     The readable version lives outside the site in ~/repos/portfolio-private; lock it with: node tools/lock.mjs -->
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-latin.woff2") format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Brunswick Grotesque";src:url("fonts/BrunswickGrotesque-Regular.otf") format("opentype");font-weight:400;font-display:swap}
:root{--p-text:#101010;--p-light:#fdfcfa;--p-tan:#d5c3ad;--p-accent:#581b11;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{display:grid;place-items:center;min-height:100svh;padding:24px 16px;background:var(--p-light);color:var(--p-text);font:400 1rem/1.55 "Plus Jakarta Sans",Arial,sans-serif}
body.checking .gate{visibility:hidden}
.gate{width:min(100%,400px);padding:32px;border:1px solid var(--p-tan);border-radius:24px;background:var(--p-light)}
.gate svg{width:28px;height:28px;color:var(--p-accent)}
.gate h1{margin:12px 0 4px;font:400 1.75rem/1.15 "Brunswick Grotesque","Plus Jakarta Sans",Arial,sans-serif;letter-spacing:-.01em}
.gate p{margin:0 0 20px}
.gate label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem}
.gate input{width:100%;padding:12px 14px;border:1px solid var(--p-tan);border-radius:12px;background:#fff;font:inherit;color:inherit}
.gate input:focus-visible{outline:2px solid var(--p-accent);outline-offset:1px}
.gate button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:1584px;background:var(--p-accent);color:var(--p-light);font:600 1rem "Plus Jakarta Sans",Arial,sans-serif;cursor:pointer}
.gate button:disabled{opacity:.6;cursor:progress}
.gate .err{min-height:1.4em;margin:10px 0 0;color:var(--p-accent);font-size:.9rem}
.gate .back{display:inline-block;margin-top:16px;font-size:.9rem;color:inherit}
</style>
</head>
<body class="checking">
<form class="gate" id="gate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <h1>Protected case study</h1>
  <p>This work is confidential. Enter the password to view it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button type="submit">Unlock</button>
  <p class="err" id="err" role="alert"></p>
  <a class="back" href="index.html#work">← Back to all work</a>
</form>
<script src="assets/lock.js"></script>
<script>
(async function(){
  const form=document.getElementById('gate'), pw=document.getElementById('pw'), err=document.getElementById('err'), btn=form.querySelector('button');
  const html=await MMLock.fromSession();          // already unlocked from the home page in this tab
  if(html){ MMLock.show(html); return; }
  document.body.classList.remove('checking'); pw.focus();
  form.addEventListener('submit',async e=>{
    e.preventDefault(); err.textContent=''; btn.disabled=true; btn.textContent='Unlocking…';
    try{ MMLock.show(await MMLock.unlock(pw.value)); }
    catch(x){
      err.textContent=x.code==='missing'?'This case study hasn\'t been locked yet.':'That password isn\'t right. Try again.';
      btn.disabled=false; btn.textContent='Unlock'; pw.select();
    }
  });
})();
</script>
</body>
</html>
